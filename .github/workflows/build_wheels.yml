# Build on every branch push, tag push, and pull request change:
# From: https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml
name: Build wheels
on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheel for ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          # pdm-backend derives the version from git describe
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - run: pip wheel -w ./wheelhouse/ .

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sdist
        shell: bash -l {0}
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/asv_runner
    permissions:
      id-token: write  # for trusted publishing
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Collect wheels and sdist into a flat dist/. Same-named v4
          # artifacts from parallel jobs are distinct objects, and a
          # name-filtered download takes only one of them: the v0.2.5
          # release published the wheel and dropped the built sdist.
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
